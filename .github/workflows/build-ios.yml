name: Сборка приложения для iPhone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Проверка JavaScript
        run: |
          node Tests/parser.test.js
          node Tests/reliability.test.js

      - name: Проверка финансового движка Swift
        run: |
          swiftc -warnings-as-errors -parse-as-library YandexFinance/FinanceEngine.swift Tests/FinanceEngineTests.swift -o /tmp/finance-tests
          /tmp/finance-tests

      - name: Сборка приложения
        run: bash scripts/build-ipa.sh

      - name: Сохранение IPA
        uses: actions/upload-artifact@v7
        with:
          name: YandexFinance-unsigned-IPA
          path: dist/YandexFinance-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
