name: Сборка приложения для iPhone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    # Xcode 27 and the iOS 27 SDK (block 5, 46.44): GitHub's image `xcode-27` (macOS 27, Xcode 27.0 by default; public preview).
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Проверка JavaScript
        run: |
          node Tests/parser.test.js
          node Tests/reliability.test.js
          node Tests/privacy.test.js

      - name: Проверка финансового движка Swift
        run: |
          swiftc -warnings-as-errors -parse-as-library YandexFinance/FinanceEngine.swift YandexFinance/PeriodSelectionLogic.swift YandexFinance/Models.swift YandexFinance/UncategorizedReview.swift YandexFinance/CategorySuggestions.swift YandexFinance/ReportSeries.swift YandexFinance/ReportEngine.swift YandexFinance/Budgets.swift YandexFinance/RegularPayments.swift YandexFinance/ReceiptParser.swift YandexFinance/ReceiptArchive.swift Tests/FinanceEngineTests.swift -o /tmp/finance-tests
          /tmp/finance-tests

      - name: Проверка сводки виджета
        run: |
          swiftc -warnings-as-errors -parse-as-library YandexFinance/WidgetSummary.swift Tests/WidgetSummaryTests.swift -o /tmp/widget-tests
          /tmp/widget-tests

      - name: Проверка импорта выписки
        run: |
          swiftc -warnings-as-errors -parse-as-library YandexFinance/FinanceEngine.swift YandexFinance/Models.swift YandexFinance/StatementImporter.swift Tests/StatementImporterTests.swift -framework PDFKit -o /tmp/statement-tests
          /tmp/statement-tests

      - name: Сборка приложения
        run: bash scripts/build-ipa.sh

      - name: Сохранение IPA
        uses: actions/upload-artifact@v7
        with:
          name: YandexFinance-unsigned-IPA
          path: dist/YandexFinance-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
